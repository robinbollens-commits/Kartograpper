name: Installers bouwen (Windows en Android)

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['src/**', 'index.html', 'desktop/**', 'mobile/**', 'icons/**', '.github/workflows/apps.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bouw de Windows-installer
        working-directory: desktop
        shell: bash
        run: |
          VERSION=$(node -e "console.log(require('fs').readFileSync('../src/kartograaf.html','utf8').match(/APP_VERSION = '([^']+)'/)[1])")
          npm install --no-audit --no-fund
          npm pkg set version=$VERSION
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Kartograaf-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Maak het Android-project
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          node copy-web.js
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#fcfcf8' --iconBackgroundColorDark '#fcfcf8' --splashBackgroundColor '#d8dce2' --splashBackgroundColorDark '#101317'
          npx cap sync android
      - name: Bouw de APK
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(node -e "console.log(require('fs').readFileSync('../src/kartograaf.html','utf8').match(/APP_VERSION = '([^']+)'/)[1])")
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kartograaf.jks"
            export KS_PATH="$RUNNER_TEMP/kartograaf.jks"
            node gradle-setup.js "$VERSION" sign
            (cd android && ./gradlew --no-daemon assembleRelease)
            cp android/app/build/outputs/apk/release/app-release.apk "Kartograaf-$VERSION.apk"
          else
            echo "::warning::Er is nog geen Android-sleutel ingesteld. Dit wordt een test-APK die je niet kunt bijwerken zonder hem eerst te verwijderen. Zie README › Android-sleutel."
            node gradle-setup.js "$VERSION"
            (cd android && ./gradlew --no-daemon assembleDebug)
            cp android/app/build/outputs/apk/debug/app-debug.apk "Kartograaf-$VERSION-test.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Kartograaf-Android
          path: mobile/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # A test APK (no signing key yet) is never published: it could not be updated later without wiping the user's maps.
          files: |
            out/*.exe
            out/Kartograaf-*[0-9].apk
          body: |
            **Windows:** download `Kartograaf-Setup-….exe` en start het. Windows kan waarschuwen dat de uitgever onbekend is: klik op *Meer informatie › Toch uitvoeren*.
            **Android:** download de `.apk` op je telefoon en open hem. Sta *Installeren uit onbekende bronnen* toe als daarom gevraagd wordt.
            Je kaarten blijven bewaard bij een update. Zie CHANGELOG.md voor wat er nieuw is.

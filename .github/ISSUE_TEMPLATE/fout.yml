name: Iets werkt niet
description: Meld een fout in Kartograpper.
title: "[Fout] "
labels: [bug]
body:
  - type: textarea
    id: wat
    attributes:
      label: Wat ging er mis?
      description: Wat deed je, wat verwachtte je, en wat gebeurde er?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser en toestel
      placeholder: Bv. Chrome op Windows, Safari op iPad
  - type: textarea
    id: extra
    attributes:
      label: Schermafbeelding of kaartbestand
      description: Sleep hier een schermafbeelding in, of een kaart die je via Bestand › Opslaan als bestand bewaarde.
